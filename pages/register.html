<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Wallacea</title>
    <base href="/website/">
    <link rel="stylesheet" href="css/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Poppins:wght@400;500;600;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login">
        <div class="gambar">
            <img class="gambar-register" src="assets/image/gambar-register.jpg">
            <div class="register-text">
                <h3>Temukan Kehidupan Langka Wallacea</h3>
                <p style="font-size: 17px;">Eksplorasi Kehidupan Langka dalam Satu Tempat</p>
            </div>
        </div>
        <div class="form-container">
            <div class="form-logo">
                <img class="logo" src="assets/image/logo-hitam.svg">
            </div>
            <form class="register" action="proses_register.php" method="post">
                <div class="email" type="text" name="email">
                    <p class="email-placeholder">Masukkan Email</p>
                    <input class="input-email" type="text" name="email" placeholder="email anda">
                </div>
                <div class="password">Masukkan Password
                    <input class="input-password" type="password" name="password" placeholder="password">
                </div>
                <button class="form-send" type="submit" name="submit">Register</button>
            </form>
            <div class="or" style="font-family: 'Poppins';">
                <span>or</span>
            </div>
                <button class="google-btn">
                    <img src="assets/image/google.svg">
                    <span>Sign in with Google</span>
                </button>
                <div class="registered">
                    <div class="login-admin">
                        <a href="login-admin.html">Login Sebagai Admin</a>
                    </div>
                    <div class="ada-akun">
                        <a href="login.html">Sudah Punya Akun? Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

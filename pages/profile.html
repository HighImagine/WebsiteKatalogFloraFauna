<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <base href="/website/">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="icon" type="image/svg" href="assets/image/logo-putih.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Poppins:wght@400;500;600;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="back-icon"></div>
    </div>
    <div class="profile">
        <img class="profile-pict" src="assets/image/profile-dummy2.svg">
        <p>Robert Fox</p>
    </div>
    <div class="edit">
        <button class="edit-button">Edit</button>
    </div>

    <div class="information">
        <div class="biodata">
            <div class="username">Username
                <div class="username-box">Robert Fox</div>
            </div>
            <div class="about">About
                <div class="about-box">Just a Normal Person</div>
            </div>
            <div class="email">Email
                <div class="email-box">robertfox@outlook.com</div>
            </div>
        </div>
    </div>
    <div class="log-out">
        <img class="log-out-icon" src="assets/image/Log-out.svg">
        <p>Log Out</p>
    </div>
</body>
</html>
